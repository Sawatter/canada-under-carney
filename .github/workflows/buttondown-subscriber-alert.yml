name: Buttondown subscriber-count alert

# Runs daily at 13:37 UTC. Polls the Buttondown API for the current subscriber
# count and fails the workflow run when the count crosses 95 — well below the
# 100-subscriber free-tier limit so there is room to upgrade or trim before
# Buttondown stops accepting new sign-ups. A failed scheduled run sends an
# email to the repo owner via GitHub's default notification settings.

on:
  schedule:
    # Avoid minute 0 because GitHub scheduled workflows are more likely to be
    # delayed or dropped at the top of the hour.
    - cron: "37 13 * * *"
  workflow_dispatch: {}

jobs:
  check-subscriber-count:
    runs-on: ubuntu-latest
    steps:
      - name: Query Buttondown subscriber count
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          ALERT_THRESHOLD: "95"
          FREE_TIER_LIMIT: "100"
        run: |
          set -euo pipefail

          if [ -z "${BUTTONDOWN_API_KEY:-}" ]; then
            echo "::error::BUTTONDOWN_API_KEY secret is not set on this repository."
            exit 1
          fi

          # Retry transient API failures; capture HTTP status and body separately so a
          # flaky, empty, or 5xx response cannot masquerade as the real subscriber-count alert.
          http_status=$(curl --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors --max-time 30 \
            --write-out "%{http_code}" --output /tmp/buttondown-response.json \
            --header "Authorization: Token ${BUTTONDOWN_API_KEY}" \
            "https://api.buttondown.com/v1/subscribers?type=regular") || http_status="000"

          count=$(jq -er '.count' /tmp/buttondown-response.json 2>/dev/null || echo "NA")

          # A transient API issue (timeout, 5xx, empty or non-JSON body) must NOT fire the
          # alert email. Warn and exit 0 so only a genuine count at/above the threshold notifies.
          if [ "$http_status" != "200" ] || ! printf '%s' "$count" | grep -qE '^[0-9]+$'; then
            echo "::warning::Could not read a valid Buttondown subscriber count (http=${http_status}, value='${count}'). Transient API issue, skipping this run. The next scheduled run retries. This is NOT a subscriber-count alert."
            exit 0
          fi

          echo "Current Buttondown subscriber count: ${count}"
          echo "Alert threshold: ${ALERT_THRESHOLD}"
          echo "Free-tier limit: ${FREE_TIER_LIMIT}"

          if [ "$count" -ge "$ALERT_THRESHOLD" ]; then
            echo "::error::Buttondown subscriber count is ${count} (>= ${ALERT_THRESHOLD}). Free-tier limit is ${FREE_TIER_LIMIT}. Upgrade the plan or prune inactive subscribers."
            exit 1
          fi

          echo "Subscriber count is below alert threshold. No action required."
