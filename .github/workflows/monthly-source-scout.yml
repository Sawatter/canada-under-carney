name: Monthly source scout

# Runs on the first day of each month after the prior month has closed.
# It surveys cited sources for new dimension-relevant material and opens a
# review PR with an editor-adjudicated candidate packet. It never edits
# dashboard data, moves grades, or pushes to main.

on:
  schedule:
    # Avoid minute 0 because GitHub scheduled workflows are more likely to be
    # delayed or dropped at the top of the hour.
    - cron: "17 13 1 * *"
  workflow_dispatch:
    inputs:
      label:
        description: "Backtest label, e.g. 2026-06-parity. Leave blank for the live monthly scout."
        required: false
        default: ""
      window_start:
        description: "Backtest search window start, YYYY-MM-DD. Required when label is set."
        required: false
        default: ""
      window_end:
        description: "Backtest search window end, YYYY-MM-DD. Required when label is set."
        required: false
        default: ""
      surface_threshold:
        description: "Backtest surface threshold."
        required: false
        default: "0.08"
      seen_ledger_path:
        description: "Optional prior candidate ledger to dedupe against."
        required: false
        default: ""
      registry_ref:
        description: "Full 40-character commit SHA to reconstruct the backtest source registry."
        required: false
        default: ""

# Least privilege for opening a review branch and PR. No write to main happens;
# the deploy workflow is the only thing that builds from main.
permissions:
  contents: write
  pull-requests: write

jobs:
  source-scout:
    runs-on: ubuntu-latest
    env:
      BACKTEST_LABEL: ${{ inputs.label || '' }}
      WINDOW_START: ${{ inputs.window_start || '' }}
      WINDOW_END: ${{ inputs.window_end || '' }}
      SURFACE_THRESHOLD: ${{ inputs.surface_threshold || '0.08' }}
      SEEN_LEDGER_PATH: ${{ inputs.seen_ledger_path || '' }}
      REGISTRY_REF: ${{ inputs.registry_ref || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Validate workflow YAML
        run: python3 scripts/validate_workflow_yaml.py

      - name: Determine cycle month
        run: |
          if [ -n "$BACKTEST_LABEL" ]; then
            echo "CYCLE_MONTH=$BACKTEST_LABEL" >> "$GITHUB_ENV"
            echo "BACKTEST_MODE=true" >> "$GITHUB_ENV"
          else
            echo "CYCLE_MONTH=$(date -u +'%Y-%m')" >> "$GITHUB_ENV"
            echo "BACKTEST_MODE=false" >> "$GITHUB_ENV"
          fi

      - name: Validate backtest inputs
        if: env.BACKTEST_LABEL != ''
        run: |
          set -euo pipefail
          python3 scripts/validate_monitor_inputs.py
          git cat-file -e "$REGISTRY_REF^{commit}"

      - name: Prepare review branch
        if: env.BACKTEST_LABEL == ''
        run: |
          set -euo pipefail
          BRANCH="source-monitor/$CYCLE_MONTH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/main"
            # Keep the previous monitor state and in-progress ledger from the
            # open monthly PR, but run current main-branch code every time.
            git checkout "origin/$BRANCH" -- monitoring/state.json monitoring/ethics-reports.json 2>/dev/null || true
            LEDGER="docs/Source-Coverage-Ledger-$CYCLE_MONTH.md"
            if git cat-file -e "origin/$BRANCH:$LEDGER" 2>/dev/null; then
              git checkout "origin/$BRANCH" -- "$LEDGER"
            fi
          else
            git checkout -B "$BRANCH" "origin/main"
          fi

      - name: Run source fetch and link-rot scan
        if: env.BACKTEST_LABEL == ''
        run: python3 scripts/fetch-data.py --link-rot --json-out scripts/output/fetch-results.json

      - name: Generate source ledger
        if: env.BACKTEST_LABEL == ''
        run: |
          set -euo pipefail
          LEDGER="docs/Source-Coverage-Ledger-$CYCLE_MONTH.md"
          if [[ -f "$LEDGER" ]]; then
            echo "Using existing source ledger: $LEDGER"
          else
            node scripts/generate-source-ledger.mjs "$CYCLE_MONTH"
          fi

      - name: Validate source ledger coverage
        if: env.BACKTEST_LABEL == ''
        run: node scripts/validate-source-ledger.mjs "$CYCLE_MONTH"

      - name: Run source monitor (deterministic + search fan-out + relevance pass)
        if: env.BACKTEST_LABEL == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 scripts/monitor_sources.py \
            --cycle "$CYCLE_MONTH" \
            --fetch-results scripts/output/fetch-results.json \
            --require-keys \
            --require-complete

      - name: Reconstruct backtest source registry
        if: env.BACKTEST_LABEL != ''
        run: |
          set -euo pipefail
          mkdir -p monitoring/backtest
          git show "$REGISTRY_REF:src/data/dimensions.json" > "monitoring/backtest/dimensions-$BACKTEST_LABEL.json"
          git show "$REGISTRY_REF:src/data/approval-polls.json" > "monitoring/backtest/approval-polls-$BACKTEST_LABEL.json"
          python3 scripts/monitor_sources.py \
            --rebuild-registry \
            --dimensions-file "monitoring/backtest/dimensions-$BACKTEST_LABEL.json" \
            --approval-file "monitoring/backtest/approval-polls-$BACKTEST_LABEL.json" \
            --sources-file "monitoring/backtest/sources-$BACKTEST_LABEL.json"

      - name: Run source monitor backtest
        if: env.BACKTEST_LABEL != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          args=(
            --cycle "$BACKTEST_LABEL"
            --sources-file "monitoring/backtest/sources-$BACKTEST_LABEL.json"
            --state-file "monitoring/backtest/state-$BACKTEST_LABEL.json"
            --ledger-path "monitoring/backtest/$BACKTEST_LABEL.json"
            --packet-path "docs/Source-Monitoring-Backtest-$BACKTEST_LABEL.md"
            --window-start "$WINDOW_START"
            --window-end "$WINDOW_END"
            --surface-threshold "$SURFACE_THRESHOLD"
            --no-deterministic
            --adjacent
            --require-keys
            --require-complete
            --compare-sources-file monitoring/sources.json
            --title-note "Backtest $BACKTEST_LABEL. Registry ref: $REGISTRY_REF. Window: $WINDOW_START to $WINDOW_END."
          )
          if [ -n "$SEEN_LEDGER_PATH" ]; then
            args+=(--seen-ledger "$SEEN_LEDGER_PATH")
          fi
          python3 scripts/monitor_sources.py "${args[@]}"

      - name: Upload source-scout artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-source-scout-${{ env.CYCLE_MONTH }}
          path: |
            scripts/output/fetch-report.txt
            scripts/output/fetch-results.json
            scripts/output/draft-changelog-entry.json
            scripts/output/draft-dimensions.json
            docs/Source-Coverage-Ledger-${{ env.CYCLE_MONTH }}.md
            docs/Source-Monitoring-Candidates-${{ env.CYCLE_MONTH }}.md
            monitoring/candidates/${{ env.CYCLE_MONTH }}.json
            monitoring/state.json
            docs/Source-Monitoring-Backtest-${{ env.CYCLE_MONTH }}.md
            monitoring/backtest/${{ env.CYCLE_MONTH }}.json
            monitoring/backtest/state-${{ env.CYCLE_MONTH }}.json
            monitoring/backtest/sources-${{ env.CYCLE_MONTH }}.json

      - name: Guard committed files for local paths
        if: env.BACKTEST_LABEL == ''
        run: |
          FILES=$(git status --porcelain -- monitoring docs/Source-Monitoring-Candidates-*.md "docs/Source-Coverage-Ledger-$CYCLE_MONTH.md" | awk '{print $2}')
          if [ -z "$FILES" ]; then
            echo "No monitoring changes to guard."
            exit 0
          fi
          # Block an absolute local path leaking into committed state. That is the
          # one identity vector that could reach generated files. The editor's
          # name / email / city patterns live in the gitignored .identity-patterns
          # and are enforced by the local pre-commit hook. That file is not on the
          # runner, and a generic email scan would false-positive on scraped
          # snippet text and fail the PR, so it is intentionally not run here.
          if grep -nE '(^|[[:space:]"'\''=:({[])(/Users/[A-Za-z]|/home/[A-Za-z])' $FILES; then
            echo "::error::Found an absolute local path in monitoring output. Stopping."
            exit 1
          fi
          echo "Guard passed."

      - name: Open or update the review PR
        if: env.BACKTEST_LABEL == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="source-monitor/$CYCLE_MONTH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add monitoring \
            docs/Source-Coverage-Ledger-"$CYCLE_MONTH".md \
            docs/Source-Monitoring-Candidates-"$CYCLE_MONTH".md
          if git diff --cached --quiet; then
            echo "No monitoring changes this run. Not opening a PR."
            exit 0
          fi

          git commit -m "Source monitor: $CYCLE_MONTH candidates (editor review, no data moved)"
          # The review branch is rebased onto origin/main each run (see Prepare
          # review branch), so a plain push is non-fast-forward on a re-dispatch
          # in the same month. force-with-lease updates the disposable branch and
          # still aborts if someone pushed to it since the fetch above.
          git push --force-with-lease -u origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already open for $BRANCH; the push updated it."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --draft \
              --title "Source monitor: $CYCLE_MONTH candidates" \
              --body "$(printf '%s\n' \
                'Automated source-monitoring candidates for editor review.' \
                '' \
                'This PR carries the candidate packet and updated monitoring state for the cycle. It does not change grades, statuses, thresholds, scoring, or any dashboard data. Everything in it is a candidate for the editor to look at and adjudicate.' \
                '' \
                '- Packet: docs/Source-Monitoring-Candidates-<cycle>.md' \
                '- Candidate ledger: monitoring/candidates/<cycle>.json' \
                '- Per-source state: monitoring/state.json' \
                '' \
                'If the search or relevance tier was skipped (missing API key), the packet says so near the top under Run status. Search-fan-out snippets are provisional discovery only and need a browser pull plus editor verification before anything is cited.')"
          fi
