name: Live Dashboard Audit

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_commit:
        description: Commit SHA to audit (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: live-dashboard-audit-${{ inputs.target_commit || github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_commit || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Pages propagation
        run: sleep 60
      - name: Audit live dashboard
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.target_commit || github.event.workflow_run.head_sha || github.sha }}
          LIVE_AUDIT_URL: https://sawatter.github.io/canada-under-carney/
        run: npm run audit:live
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-dashboard-audit
          path: tmp/live-coverage-audit
