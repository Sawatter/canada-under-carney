    <!-- Theme init runs before paint so there's no light-mode flash. Default to
         the OS preference, then override only with a VALIDATED saved choice.
         A saved "system" keeps the OS-derived value. matchMedia and storage
         live in separate try blocks so a storage failure still respects the
         OS instead of forcing light. -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        try {
          var saved = localStorage.getItem("ccc-theme");
          if (saved === "dark" || saved === "light") theme = saved;
          // saved === "system" (or anything else) keeps the OS preference above
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
